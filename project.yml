name: Murmur
options:
  bundleIdPrefix: com.sushildalavi
  createIntermediateGroups: true
  projectFormat: 60
settings:
  base:
    SWIFT_VERSION: 5.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  MurmurCore:
    path: MurmurCore
targets:
  MurmurApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MurmurApp
    dependencies:
      - package: MurmurCore
    settings:
      base:
        INFOPLIST_FILE: MurmurApp/Resources/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_ENTITLEMENTS: MurmurApp/Resources/Murmur.entitlements
  MurmurMacApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MurmurApp
    dependencies:
      - package: MurmurCore
    settings:
      base:
        INFOPLIST_FILE: MurmurApp/Resources/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
  MurmurMacAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MurmurAppTests
    dependencies:
      - target: MurmurMacApp
      - package: MurmurCore
  MurmurWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: MurmurWatchApp
    dependencies:
      - package: MurmurCore
    settings:
      base:
        INFOPLIST_FILE: MurmurWatchApp/Resources/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
schemes:
  MurmurApp:
    build:
      targets:
        MurmurApp: all
  MurmurMacApp:
    build:
      targets:
        MurmurMacApp: all
    test:
      targets:
        - MurmurMacAppTests
  MurmurWatchApp:
    build:
      targets:
        MurmurWatchApp: all
